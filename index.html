<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CrapSDK Data Collector</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
      background: #121212;
      color: #fff;
    }

    h1 {
      font-size: 1.5rem;
      text-align: center;
    }

    .card {
      background: #1e1e1e;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    .val {
      font-size: 1.4em;
      font-weight: bold;
      color: #00ff66;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #aaa;
    }

    select,
    button {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      border: none;
      margin-bottom: 10px;
      box-sizing: border-box;
    }

    select {
      background: #2c2c2e;
      color: #fff;
    }

    .btn-perm {
      background: #007aff;
      color: white;
      font-weight: bold;
    }

    .btn-rec {
      background: #34c759;
      color: white;
      font-weight: bold;
    }

    .btn-stop {
      background: #ff3b30;
      color: white;
      font-weight: bold;
      display: none;
    }

    .btn-export {
      background: #5856d6;
      color: white;
      font-weight: bold;
      display: none;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    #status {
      font-weight: bold;
      color: #ff9500;
      text-align: center;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

  <h1>💩 CrapSDK Session Recorder</h1>

  <button id="permBtn" class="btn-perm">1. Enable Sensors</button>

  <div class="card">
    <label for="labelSelect">Current Activity Label:</label>
    <select id="labelSelect">
      <option value="Toilet">Toilet Session 🚽</option>
      <option value="Couch">Couch / Sofa 🛋️</option>
      <option value="Desk">Desk / Table 💻</option>
      <option value="Walking">Walking 🚶</option>
      <option value="Standing">Standing Idle 🧍</option>
    </select>

    <button id="startRecBtn" class="btn-rec" disabled>2. Start Recording</button>
    <button id="stopRecBtn" class="btn-stop">Stop Recording</button>
  </div>

  <div id="status">Sensors inactive. Click Enable Sensors.</div>

  <div class="card grid">
    <div>Tilt (Beta): <br><span id="beta" class="val">0</span>°</div>
    <div>Accel: <br><span id="accel" class="val">0</span> m/s²</div>
  </div>

  <div class="card">
    <div>Recorded Samples: <span id="sampleCount" class="val">0</span></div>
    <div>Session Duration: <span id="duration" class="val">0</span>s</div>
  </div>

  <button id="downloadBtn" class="btn-export">Download Session CSV</button>
  <button id="copyBtn" class="btn-export">Copy CSV to Clipboard</button>

  <script>
    let isRecording = false;
    let recordingTimer = null;
    let startTime = 0;
    let samples = [];

    // Latest sensor snapshot
    let currentSensors = {
      beta: 0,   // Pitch (front/back tilt)
      gamma: 0,  // Roll (left/right tilt)
      alpha: 0,  // Yaw/Compass
      accelMag: 0 // Acceleration magnitude
    };

    const permBtn = document.getElementById('permBtn');
    const startRecBtn = document.getElementById('startRecBtn');
    const stopRecBtn = document.getElementById('stopRecBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const copyBtn = document.getElementById('copyBtn');
    const labelSelect = document.getElementById('labelSelect');
    const statusEl = document.getElementById('status');
    const betaEl = document.getElementById('beta');
    const accelEl = document.getElementById('accel');
    const sampleCountEl = document.getElementById('sampleCount');
    const durationEl = document.getElementById('duration');

    // 1. Permission Setup
    permBtn.addEventListener('click', async () => {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const permission = await DeviceOrientationEvent.requestPermission();
          if (permission === 'granted') {
            setupSensors();
          } else {
            statusEl.innerText = 'Permission Denied!';
          }
        } catch (e) {
          statusEl.innerText = 'Error: ' + e.message;
        }
      } else {
        setupSensors();
      }
    });

    function setupSensors() {
      permBtn.style.display = 'none';
      startRecBtn.disabled = false;
      statusEl.innerText = 'Sensors Active! Ready to record.';
      statusEl.style.color = '#34c759';

      window.addEventListener('deviceorientation', (e) => {
        currentSensors.beta = e.beta ? e.beta.toFixed(2) : 0;
        currentSensors.gamma = e.gamma ? e.gamma.toFixed(2) : 0;
        currentSensors.alpha = e.alpha ? e.alpha.toFixed(2) : 0;
        betaEl.innerText = Math.round(currentSensors.beta);
      });

      window.addEventListener('devicemotion', (e) => {
        const acc = e.accelerationIncludingGravity;
        if (acc) {
          const mag = Math.sqrt(acc.x ** 2 + acc.y ** 2 + acc.z ** 2);
          currentSensors.accelMag = mag.toFixed(2);
          accelEl.innerText = currentSensors.accelMag;
        }
      });
    }

    // 2. Start Recording Session
    startRecBtn.addEventListener('click', () => {
      isRecording = true;
      samples = [];
      startTime = Date.now();

      startRecBtn.style.display = 'none';
      stopRecBtn.style.display = 'block';
      downloadBtn.style.display = 'none';
      copyBtn.style.display = 'none';
      labelSelect.disabled = true;

      statusEl.innerText = `🔴 RECORDING [${labelSelect.value}]...`;
      statusEl.style.color = '#ff3b30';

      recordingTimer = setInterval(() => {
        const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);

        samples.push({
          timestamp: elapsed,
          label: labelSelect.value,
          beta: currentSensors.beta,
          gamma: currentSensors.gamma,
          alpha: currentSensors.alpha,
          accelMag: currentSensors.accelMag
        });

        sampleCountEl.innerText = samples.length;
        durationEl.innerText = Math.round(elapsed);
      }, 100);
    });

    // 3. Stop Recording
    stopRecBtn.addEventListener('click', () => {
      isRecording = false;
      clearInterval(recordingTimer);

      startRecBtn.style.display = 'block';
      stopRecBtn.style.display = 'none';
      downloadBtn.style.display = 'block';
      copyBtn.style.display = 'block';
      labelSelect.disabled = false;

      statusEl.innerText = '✅ Recording complete! Download data below.';
      statusEl.style.color = '#34c759';
    });

    // 4. Export Functions
    function generateCSV() {
      let csv = 'timestamp_sec,label,beta_pitch,gamma_roll,alpha_yaw,accel_magnitude\n';
      samples.forEach(s => {
        csv += `${s.timestamp},${s.label},${s.beta},${s.gamma},${s.alpha},${s.accelMag}\n`;
      });
      return csv;
    }

    downloadBtn.addEventListener('click', () => {
      const csvData = generateCSV();
      const blob = new Blob([csvData], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.setAttribute('href', url);
      a.setAttribute('download', `crapsdk_${labelSelect.value.toLowerCase()}_${Date.now()}.csv`);
      a.click();
    });

    copyBtn.addEventListener('click', () => {
      const csvData = generateCSV();
      navigator.clipboard.writeText(csvData).then(() => {
        alert('CSV copied to clipboard!');
      });
    });
  </script>
</body>

</html>
